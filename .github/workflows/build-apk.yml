name: Build PersoPhoto APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace

      - name: Build Android Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Copy and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/PersoPhoto-1.0.0.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersoPhoto-1.0.0-APK
          path: dist/PersoPhoto-1.0.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0"
          NOTES="📸 **PersoPhoto AI v1.0.0 (پرسو فوتو)** — اپلیکیشن هوشمند طراحی و ادیت عکس پرسنلی، پاسپورت و لاتاری برای اندروید

**امکانات کلیدی:**
- 🖼️ **حذف هوشمند پس‌زمینه و سفید کردن خالص (#FFFFFF)** مطابق استانداردهای رسمی بیومتریک
- 💡 **تنظیم خودکار نور و رنگ (Auto Exposure & Lighting)** بر اساس شاخص استاندارد پرسنلی و پرتره
- ✂️ **کادربندی و برش هوشمند بیومتریک** با تشخیص خودکار چهره و تراز چشم‌ها
- 📐 **پشتیبانی کامل از تمام استانداردهای اداری و بین‌المللی:**
  - ۳×۴ سانتی‌متر (شناسنامه، کارت ملی، مدارک اداری ایران)
  - پاسپورت استاندارد ICAO (۳.۵×۴.۵ سانتی‌متر)
  - لاتاری و ویزای آمریکا (۵×۵ سانتی‌متر / ۲×۲ اینچ)
  - ویزای شنگن (۳.۵×۴.۵ سانتی‌متر با پوشش ۸۰٪ چهره)
  - ویزای کانادا (۵×۷ سانتی‌متر)
  - عکس ۴×۶ سانتی‌متر
- 🖨️ **طرح‌بندی برگه‌های چاپی ۶ تایی و ۱۲ تایی:**
  - برگه ۶ تایی روی کاغذ استاندارد ۱۰×۱۵ سانتی‌متر (4x6 اینچ) لابراتوار عکاسی
  - برگه ۱۲ تایی روی کاغذ ۱۳×۱۸ یا A4
  - همراه با خطوط برش دقیق (Cut Guides) برای برش آسان با قیچی یا گیوتین
- 📄 **خروجی باکیفیت تصویری و PDF:**
  - خروجی تصویر با کیفیت ۳۰۰ DPI (Ultra-High Resolution)
  - خروجی فایل PDF با ابعاد فیزیکی ۱:۱ برای پرینت مستقیم روی چاپگرهای خانگی و استودیویی
- 🎨 **رابط کاربری مدرن فارسی (Jetpack Compose + Material 3)** با آیکون اختصاصی و دوربین هوشمند"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading asset..."
            gh release upload "$TAG_NAME" dist/PersoPhoto-1.0.0.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" dist/PersoPhoto-1.0.0.apk --title "PersoPhoto AI v1.0.0 — استودیو هوشمند عکس پرسنلی و لاتاری" --notes "$NOTES"
          fi
